
{% extends "products/base.html" %}

{% block content %}
{% if error %}
<p>{{ error }}</p>
{% endif %}


<h1>Register</h1>

<form method="POST">
    {% csrf_token %}

    <label>Username:</label>
    <input type="text" name="username">

    <br>

    <label>Password:</label>
    <input type="password" name="password">

    <br>

    <button type="submit">Register</button>

</form>

{% endblock %}
